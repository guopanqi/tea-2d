name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取站点文件
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 准备静态站点和版本标记
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html style.css daily.css "$RUNNER_TEMP/site/"
          cp -R js assets "$RUNNER_TEMP/site/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/site/build-version.txt"
          touch "$RUNNER_TEMP/site/.nojekyll"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/js/main.js"
          test -s "$RUNNER_TEMP/site/js/daily.js"
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 等待发布接口可读取站点产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' 2>/dev/null || true)"
            if [[ -n "$artifact_id" ]]; then
              echo "站点产物已可读取: $artifact_id"
              sleep 5
              exit 0
            fi
            echo "产物暂不可读取 ($attempt/30)，10 秒后重试"
            sleep 10
          done
          echo "::error::站点产物 5 分钟后仍不可读取，未启动发布"
          exit 1
      - name: 发布站点
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 验证线上版本和关键静态资源
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --connect-timeout 5 --max-time 12 -H 'Cache-Control: no-cache' "$base/build-version.txt?sha=$GITHUB_SHA&attempt=$attempt" || true)"
            if [[ "$actual" == "$GITHUB_SHA" ]]; then
              for asset in index.html style.css daily.css js/main.js js/daily.js; do
                curl -fsSL --retry 2 --connect-timeout 5 --max-time 12 "$base/$asset?sha=$GITHUB_SHA" -o /dev/null
              done
              echo "线上版本已验证: $GITHUB_SHA"
              exit 0
            fi
            echo "线上版本尚未更新 ($attempt/30)"
            sleep 10
          done
          echo "::error::发布已返回成功，但线上版本未通过校验"
          exit 1
