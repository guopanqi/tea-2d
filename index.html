<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tea-2d-demo</title>
<link rel="stylesheet" href="style.css?v=mobile-cabinet-1">
<link rel="stylesheet" href="daily.css?v=5-compact-note">
</head>
<body>
<audio id="background-music" src="assets/background-music.mp3" loop preload="auto" aria-hidden="true"></audio>
<div id="stage">
  <header id="tea-toolbar"><div class="tea-status">  <section id="daily-water" aria-label="每日饮水"></section>  <section id="formula-hud" aria-live="polite">
    <div class="hud-heading"><span>此刻方笺</span><button id="undo-herb" type="button">退一味</button></div>
    <div id="formula-summary">杯中尚清</div>
    <div id="formula-chips"></div>
    <div id="formula-message">将草木投入杯中，配伍会在这里显现。</div>
  </section></div><nav class="tea-tools" aria-label="茶盘工具">  <button id="constitution-btn" type="button" aria-haspopup="dialog"><span aria-hidden="true">◇</span>体质辨识</button>  <button id="cabinet-btn" type="button" aria-expanded="false" aria-controls="herb-cabinet"><span class="cabinet-drawers" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>百草柜</span></button></nav></header>
  <canvas id="scene"></canvas>
  <div id="cursor-dot"></div>
  <button id="mute-btn" title="静音" aria-label="静音">♪</button>
  <div id="reset-btn">再沏一盏</div>



  <dialog id="constitution-panel" aria-labelledby="constitution-title">
    <header><h2 id="constitution-title">体质辨识</h2><button id="constitution-close" type="button" aria-label="关闭">×</button></header>
    <p>自然光下拍摄舌象，不使用滤镜。</p>
    <label id="tongue-upload"><img id="tongue-preview" alt="舌象预览" hidden><span id="tongue-placeholder">＋<small>拍摄或上传舌象</small></span><input id="tongue-file" type="file" accept="image/*" capture="environment"></label>
    <p>单张舌象不能可靠辨识体质或诊断疾病。照片默认仅在本机预览。</p>
    <button id="tongue-analyze" type="button" disabled>开始分析</button>
    <div id="tongue-result" role="status"></div>
  </dialog>

  <aside id="herb-cabinet" aria-hidden="true" inert>
    <div class="cabinet-head">
      <div><small>一盏 · 百草柜</small><h2>择五味置于茶盘</h2></div>
      <button id="cabinet-close" type="button" aria-label="合上药柜">×</button>
    </div>
    <p class="cabinet-intro">点选药材与茶盘交换。茶盘最多五味；同一味可反复投入杯中。</p>
    <div id="cabinet-grid"></div>
    <div class="cabinet-rule"></div>
    <div class="recipe-heading"><span>茶方笺</span><small>点一下换好茶盘</small></div>
    <div id="recipe-list"></div>
    <p class="medical-note">本体验只呈现传统中医药理论与一般饮用提醒，不构成诊断、处方或个体化用药建议。孕期、儿童、慢病或正在服药者，请先咨询医生或药师。</p>
  </aside>
  <div id="cabinet-scrim"></div>
</div>
<script type="module" src="js/main.js?v=mobile-cabinet-1"></script>
<script type="module" src="js/daily.js?v=4-two-cups"></script>
</body>
</html>
